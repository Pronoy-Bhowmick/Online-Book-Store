<html>

<head>
    <title>Online Food Delivery System</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div style="border: 2px solid rgb(82, 93, 195); padding: 10px; text-align: center;">
        <h2>Online Food Delivery System</h2>
    </div><br><br>

    <div style="margin: 20px; padding: 10px; border: 1px solid white; text-align: left;">
        <h3>Search Food:</h3>
        <input type="text" placeholder="Search by Food name or Restaurant..." style="padding:5px; width: 250px;">
        <input type="submit" value="Search"><br><br>
    </div>

    <div style="text-align: right;">
    </div>

    <label for="category"> Food category: </label>
    <select id="category" name="category">
        <option value="Fast Food">Fast Food</option>
        <option value="Biryani & Kacchi">Biryani & Kacchi</option>
        <option value="Pizza & Burgers">Pizza & Burgers</option>
        <option value="Chinese & Thai">Chinese & Thai</option>
    </select><br><br>

    <div style="margin: 20px; padding: 10px; border: 1px solid black;">
        <p>Featured Foods / Restaurants:</p>
        1. <b>Burger Xpress Special Meal</b><br>
        2. <b>Kacchi Bhai Mutton Kacchi</b><br>
        3. <b>Cheesy Pepperoni Pizza</b><br>
        4. <b>Crispy Fried Chicken Combo</b>
    </div><br><br>

    <div style="text-align: center;">
        <a href="login.html" style="margin-right:40px;">Log In</a>
    </div>
</body>
</html>
