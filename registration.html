<html>

<head>
    <title>Registration - Online Food Delivery System</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <div style="border: 2px solid rgb(82, 93, 195); padding: 10px; text-align: center;">
        <h2>Online Food Delivery System - Registration</h2>
    </div>
    <br><br>

    <form>

        <fieldset>
            <legend><b>1. Personal Details</b></legend>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" placeholder="Enter full name"><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter email"><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number"><br><br>
        </fieldset><br>

        <fieldset>
            <legend><b>2. Security</b></legend><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"><br><br>

            <label for="cpassword">Confirm Password:</label><br>
            <input type="password" id="cpassword" name="cpassword"><br><br>
        </fieldset><br>

        <fieldset>
            <legend><b>3. Delivery & Food Preferences</b></legend><br>
            <label for="address">Delivery Address:</label><br>
            <textarea id="address" name="address" rows="4" placeholder="Enter delivery address" style="width: 50%;"></textarea><br><br>

            <label for="category">Favorite Food Category:</label><br>
            <select id="category" name="category">
                <option value="Fast Food">Fast Food</option>
                <option value="Biryani & Kacchi">Biryani & Kacchi</option>
                <option value="Pizza & Burgers">Pizza & Burgers</option>
                <option value="Chinese & Thai">Chinese & Thai</option>
            </select><br><br>
        </fieldset>
    
        <fieldset>
            <legend><b>4. Terms & Social Login</b></legend><br>
            <p>Social Login:</p>
            <input type="button" value="Continue with Google">
            <input type="button" value="Continue with Facebook"><br><br>

            <input type="checkbox" id="terms" name="terms">
            <label for="terms">I agree to the Terms & Conditions</label><br><br>
        </fieldset><br>

        <div style="text-align: center;">
            <input type="submit" value="Register">
            <input type="reset" value="Reset"><br><br>
            <p>Already have an account? </p>
            <a href="login.html">Log In</a><br>
            <a href="Homepage.html">Back to Home</a>
        </div>

    </form>

<script src="script.js"></script>
</body>
</html>
